<!DOCTYPE html>
<html lang="tg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Забономӯз</title>
<style>
:root{--bg:#fff;--fg:#1e1b4b;--mut:#6b7280;--card:#f1f5f9;--bd:#e2e8f0;--pri:#6366f1;--ok:#bbf7d0;--no:#fecaca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--fg:#f1f5f9;--mut:#94a3b8;--card:#1e293b;--bd:#334155;--ok:#14532d;--no:#7f1d1d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--fg:#f1f5f9;--mut:#94a3b8;--card:#1e293b;--bd:#334155;--ok:#14532d;--no:#7f1d1d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 16px 100px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top .bar{flex:1}
.pill{background:var(--card);border-radius:20px;padding:6px 12px;font-weight:700;white-space:nowrap;border:0;color:var(--fg);font-size:inherit}
.sp{flex:1}
.mh{color:#fff;border-radius:16px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-bottom:8px}.mh small{opacity:.85;font-weight:700}.mh b{display:block;font-size:18px}
.gl{font-size:13px;color:var(--mut);margin:6px 0}
.bar{height:12px;background:var(--card);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.dv{text-align:center;color:var(--mut);font-weight:700;margin:22px 0 10px;border-top:2px solid var(--bd);padding-top:10px}
.nr{display:flex;justify-content:center;margin:12px 0}
.nd{width:68px;height:68px;border-radius:50%;border:0;border-bottom:6px solid rgba(0,0,0,.25);background:var(--c);color:#fff;font-size:28px}
.nd.l{background:var(--card);color:var(--mut);border-bottom-color:var(--bd)}.nd.d{opacity:.7}
.nd.o{animation:pl 1.4s infinite}@keyframes pl{50%{transform:scale(1.1)}}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
.tabs button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px}.tabs button.on{color:var(--pri);background:var(--card)}.tabs span{display:block;font-size:22px}
h1{font-size:22px;margin:8px 0 12px}
.lb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;padding:14px;margin-bottom:10px;font:inherit;font-weight:700;font-size:17px}
.q{font-size:24px;font-weight:800;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;font-size:18px}
.opt.ok,.mt.ok{background:var(--ok);border-color:#22c55e}.opt.no,.mt.no{background:var(--no);border-color:#ef4444}.mt.sel{border-color:var(--pri)}.mt{display:block;width:100%;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 6px;margin-bottom:8px;font:inherit}
.btn{display:block;width:100%;border:0;border-bottom:4px solid rgba(0,0,0,.25);background:var(--pri);color:#fff;font:inherit;font-weight:800;border-radius:14px;padding:14px;margin-top:12px}.btn.g{background:var(--card);color:var(--fg);border-bottom-color:var(--bd)}
.snd{border:0;background:var(--card);color:var(--fg);border-radius:50%;width:46px;height:46px;font-size:22px;margin-left:8px}
.fb{margin-top:10px;padding:12px;border-radius:12px;font-weight:700}.fb.g{background:var(--ok)}.fb.b{background:var(--no)}
input.in{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--fg)}
.ans,.tl{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px 0}.ans{border-bottom:2px solid var(--bd);margin-bottom:10px}
.tk{border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;font:inherit;font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bub{background:var(--card);border-radius:16px;padding:14px;font-size:20px;font-weight:700;margin-bottom:14px}
.lk{background:none;border:0;color:var(--mut);font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.note{color:var(--mut);font-size:13px;margin-top:16px}
</style></head><body>

{e:"🍞",n:"Хӯрок",m:1,w:[["Нон","Bread","Хлеб","Ekmek","面包","빵"],["Об","Water","Вода","Su","水","물"],["Себ","Apple","Яблоко","Elma","苹果","사과"],["Гӯшт","Meat","Мясо","Et","肉","고기"],["Шир","Milk","Молоко","Süt","牛奶","우유"],["Чой","Tea","Чай","Çay","茶","차"]]},
{e:"🐶",n:"Ҳайвонот",m:1,w:[["Саг","Dog","Собака","Köpek","狗","개"],["Гурба","Cat","Кошка","Kedi","猫","고양이"],["Асп","Horse","Лошадь","At","马","말"],["Парранда","Bird","Птица","Kuş","鸟","새"],["Моҳӣ","Fish","Рыба","Balık","鱼","물고기"],["Гов","Cow","Корова","İnek","牛","소"]]},
{e:"🌳",n:"Табиат",m:2,w:[["Офтоб","Sun","Солнце","Güneş","太阳","해"],["Моҳ","Moon","Луна","Ay","月亮","달"],["Дарахт","Tree","Дерево","Ağaç","树","나무"],["Кӯҳ","Mountain","Гора","Dağ","山","산"],["Дарё","River","Река","Nehir","河","강"],["Борон","Rain","Дождь","Yağmur","雨","비"]]},

{e:"🌍",n:"Давлатҳо",m:3,w:[["Тоҷикистон","Tajikistan","Таджикистан","Tacikistan","塔吉克斯坦","타지키스탄"],["Русия","Russia","Россия","Rusya","俄罗斯","러시아"],["Туркия","Turkey","Турция","Türkiye","土耳其","터키"],["Чин","China","Китай","Çin","中国","중국"],["Корея","Korea","Корея","Kore","韩国","한국"],["Амрико","USA","США","ABD","美国","미국"]]},
{e:"🏙️",n:"Шаҳрҳо",m:3,w:[["Душанбе","Dushanbe","Душанбе","Duşanbe","杜尚别","두샨베"],["Хуҷанд","Khujand","Худжанд","Hocent","苦盏","후잔드"],["Москва","Moscow","Москва","Moskova","莫斯科","모스크바"],["Истанбул","Istanbul","Стамбул","İstanbul","伊斯坦布尔","이스탄불"],["Пекин","Beijing","Пекин","Pekin","北京","베이징"],["Сеул","Seoul","Сеул","Seul","首尔","서울"]]}];
var PH=[["Ман чой менӯшам","I drink tea","Я пью чай","Ben çay içiyorum","我 喝 茶","저는 차를 마셔요"],["Ин китоби ман аст","This is my book","Это моя книга","Bu benim kitabım","这 是 我的 书","이것은 제 책이에요"],["Ту аз куҷо ҳастӣ","Where are you from","Ты откуда","Sen nerelisin","你 来自 哪里","어디에서 왔어요"],["Ман ба Москва меравам","I go to Moscow","Я еду в Москву","Ben Moskovaya gidiyorum","我 去 莫斯科","저는 모스크바에 가요"],["Номи ман Али аст","My name is Ali","Меня зовут Али","Benim adım Ali","我 叫 阿里","제 이름은 알리예요"],["Ҳаво имрӯз хуб аст","The weather is nice today","Сегодня хорошая погода","Bugün hava güzel","今天 天气 很好","오늘 날씨가 좋아요"]];

var DA=[["Ман аз Тоҷикистон ҳастам","I am from Tajikistan","Я из Таджикистана","Ben Tacikistanlıyım","我 来自 塔吉克斯坦","저는 타지키스탄에서 왔어요"],["Номи ман Али аст","My name is Ali","Меня зовут Али","Benim adım Ali","我 叫 阿里","제 이름은 알리예요"],["Ҳаво имрӯз хуб аст","The weather is nice today","Сегодня хорошая погода","Bugün hava güzel","今天 天气 很好","오늘 날씨가 좋아요"]];
var S={lang:"",p:{},xp:0,streak:0,last:"",td:"",tx:0,goal:50,theme:"auto",snd:1};
try{var s0=JSON.parse(localStorage.getItem("zabon2")||"null");if(s0)S=Object.assign(S,s0)}catch(e){}
function save(){try{localStorage.setItem("zabon2",JSON.stringify(S))}catch(e){}}
var app=document.getElementById("app"),tab="home",ob=0;
function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function K(){return OR.indexOf(S.lang)+1}function P0(){return S.p[S.lang]||0}
function day(d){return new Date(Date.now()-(d||0)*864e5).toISOString().slice(0,10)}
function nz(s){return String(s).toLowerCase().replace(/[.,!?？。，\s]/g,"")}
function say(t){if(!S.snd)return;try{var u=new SpeechSynthesisUtterance(t.replace(/ /g,S.lang=="zh"?"":" "));u.lang=LG[S.lang][2];speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function theme(){document.documentElement.dataset.theme=S.theme=="auto"?"":S.theme}theme();
function $(i){return document.getElementById(i)}
function bind(sel,fn){app.querySelectorAll(sel).forEach(function(b){b.onclick=function(){fn(b)}})}
function tabs(){var T=[["home","🏠","Роҳ"],["prac","🏋️","Машқ"],["dlg","💬","Муколама"],["me","👤","Профил"]];$("tb").style.display=Q&&inL?"none":"flex";$("tb").innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab==t[0]?"on":"")+'"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("");$("tb").querySelectorAll("button").forEach(function(b){b.onclick=function(){tab=b.dataset.t;render()}})}
function topb(){if(S.td!=day()){S.td=day();S.tx=0}return '<div class="top"><button class="pill" id="lg">'+LG[S.lang][1]+' '+LG[S.lang][0]+'</button><span class="sp"></span><span class="pill">🔥 '+(S.last==day()||S.last==day(1)?S.streak:0)+'</span><span class="pill">⭐ '+S.xp+'</span></div>'}
var Q=null,inL=false;
function render(){inL=false;tabs();if(!S.lang||ob)return onboard();
 if(tab=="home")home();else if(tab=="prac")card("🏋️ Машқи омехта","Калимаҳо ва ҷумлаҳои омӯхтаатонро такрор кунед.",function(){startL(mix(),{})});else if(tab=="dlg")card("💬 Муколама бо Зебо","Зебо ба забони омӯхтаатон мепурсад, шумо ҷавоби дуруст интихоб кунед.",function(){startL(dlg(),{})});else me()}
function onboard(){var h='<h1>'+(ob==2?'Чӣ қадар медонед?':'Кадом забонро меомӯзед?')+'</h1>';
 if(ob==2){[[0,"🌱 Аз сифр оғоз мекунам"],[8,"🌿 Каме медонам"],[16,"🌳 Хуб медонам"]].forEach(function(o){h+='<button class="lb" data-p="'+o[0]+'">'+o[1]+'</button>'});app.innerHTML=h;bind("[data-p]",function(b){S.p[S.lang]=+b.dataset.p;ob=0;save();render()});return}
 OR.forEach(function(k){h+='<button class="lb" data-l="'+k+'">'+LG[k][1]+' '+LG[k][0]+'</button>'});h+='<p class="note">Забони асосӣ: тоҷикӣ. Мавзӯъҳо ва забонҳои нав минбаъд илова мешаванд.</p>';app.innerHTML=h;
 bind("[data-l]",function(b){S.lang=b.dataset.l;if(S.p[S.lang]===undefined)ob=2;else ob=0;save();render()})}
function card(t,d,fn){app.innerHTML=topb()+'<h1>'+t+'</h1><p>'+d+'</p><button class="btn" id="go">Оғоз</button>';$("lg").onclick=function(){ob=1;render()};$("go").onclick=fn}
function home(){var p=P0(),cur=Math.min(Math.floor(p/4),TP.length-1),ct=TP[cur];
 var h=topb()+'<div class="mh" style="background:'+MC[ct.m-1]+'"><small>МОДУЛ '+ct.m+' · БАХШИ '+(cur+1)+'</small><b>'+ct.e+' '+ct.n+'</b></div><div class="gl">Ҳадафи имрӯза: '+S.tx+' / '+S.goal+' XP</div><div class="bar"><i style="width:'+Math.min(100,S.tx/S.goal*100)+'%"></i></div>';
 TP.forEach(function(t,i){h+='<div class="dv">'+t.e+' '+t.n+'</div>';for(var k=0;k<4;k++){var ix=i*4+k,st=ix<p?"d":ix==p?"o":"l",off=Math.round(Math.sin(ix*1.1)*56);h+='<div class="nr" style="transform:translateX('+off+'px)"><button class="nd '+st+'" data-i="'+ix+'" style="--c:'+MC[t.m-1]+'">'+(st=="l"?"🔒":st=="d"?"✓":IC[k])+'</button></div>'}});

 app.innerHTML=h;$("lg").onclick=function(){ob=1;render()};
 bind("[data-i]",function(b){var ix=+b.dataset.i;if(ix>p)return;startL(build(TP[Math.floor(ix/4)],ix%4),{node:ix})})}
// --- generators
function opts(pool,col,a){var o=pool.map(function(w){return w[col]}).filter(function(x,i,r){return x!=a&&r.indexOf(x)==i});return sh(sh(o).slice(0,3).concat([a]))}
function mkCh(w,pool){var k=K(),v=Math.floor(Math.random()*3);if(v==2&&!window.speechSynthesis)v=1;
 if(v==0)return {t:"ch",p:w[0],a:w[k],o:opts(pool,k,w[k]),s:w[k]};
 if(v==1)return {t:"ch",p:w[k],a:w[0],o:opts(pool,0,w[0]),s:w[k],sp:1};
 return {t:"ch",p:"Чӣ шунидед?",a:w[0],o:opts(pool,0,w[0]),s:w[k],sp:1,au:1}}

function build(t,k){var w=t.w;if(k==0)return sh(w).map(function(x){return mkCh(x,w)});if(k==1)return sh(w).map(mkTy);
 if(k==2)return [mkMt(sh(w).slice(0,4))].concat(sh(PH).slice(0,3).map(mkPz),sh(w).slice(0,2).map(function(x){return mkCh(x,w)}));
 return sh(w).slice(0,5).map(function(x){return {t:"sp",a:x[K()],p:x[0],s:x[K()]}})}
function mix(){var p=P0(),n=Math.max(1,Math.min(TP.length,Math.floor(p/4))),pool=[];TP.slice(0,n).forEach(function(t){pool=pool.concat(t.w)});
 var q=sh(pool).slice(0,6).map(function(w,i){return i%2?mkTy(w):mkCh(w,pool)});return sh(q.concat(sh(PH).slice(0,2).map(mkPz)))}

 if(q.t=="ch"){h+='<div class="q">'+(q.au?'Чӣ шунидед?':(q.sp?'Тарҷума кунед:<br>':'Тарҷума кунед:<br>')+q.p)+(q.sp?'<button class="snd" id="sn">🔊</button>':'')+'</div>'+q.o.map(function(o){return '<button class="opt">'+o+'</button>'}).join('')+'<div id="f"></div>';app.innerHTML=h;
  if($("sn"))$("sn").onclick=function(){say(q.s)};if(q.au)say(q.s);var lock=0;

 else if(q.t=="ty"){h+='<div class="q">Ба '+LG[S.lang][0].toLowerCase()+' нависед:<br>'+q.p+'</div><input class="in" id="in" autocomplete="off" autocapitalize="off"><div id="f"><button class="btn" id="ck">Санҷед</button></div>';app.innerHTML=h;
