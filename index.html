:root{
  --bg:#f8fafc;
  --fg:#0f172a;
  --mut:#64748b;

  --pri:#4f46e5;
  --pri-dark:#4338ca;
  --ok:#22c55e;
  --no:#ef4444;
  --shadow:0 8px 32px rgba(79, 70, 229, 0.08);
  --shadow-lg:0 14px 40px rgba(0,0,0,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090d16;--fg:#f1f5f9;--mut:#94a3b8;--card:rgba(30, 41, 59, 0.85);--bd:#334155;
    --shadow:0 8px 32px rgba(0,0,0,.4);--shadow-lg:0 14px 40px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090d16;--fg:#f1f5f9;--mut:#94a3b8;--card:rgba(30, 41, 59, 0.85);--bd:#334155;
  --shadow:0 8px 32px rgba(0,0,0,.4);--shadow-lg:0 14px 40px rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  backdrop-filter: blur(10px);
}
main{max-width:480px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pill{
  background:var(--card);
  backdrop-filter: blur(12px);
  border-radius:24px;
  padding:8px 14px;
  font-weight:700;
  white-space:nowrap;
  border:1px solid var(--bd);
  color:var(--fg);
  font-size:14px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .1s;
}
.pill:active{transform:scale(0.96)}
.sp{flex:1}
.mh{
  color:#fff;
  border-radius:22px;
  padding:18px 20px;
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  margin-bottom:12px;
  box-shadow:var(--shadow-lg);
  backdrop-filter: blur(10px);
}
.mh small{opacity:.9;font-weight:700;font-size:12px;letter-spacing:.5px}
.mh b{display:block;font-size:22px;margin-top:2px}
.gl{font-size:13px;color:var(--mut);margin:8px 0 6px;font-weight:600}
.bar{height:10px;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#0d9488);transition:width .4s ease}
.dv{text-align:center;color:var(--mut);font-weight:700;margin:28px 0 14px;font-size:13px;letter-spacing:.5px}
.nr{display:flex;justify-content:center;margin:14px 0}
.nd{
  width:72px;height:72px;border-radius:50%;border:0;
  background:var(--c);color:#fff;font-size:30px;
  box-shadow:0 6px 0 rgba(0,0,0,.15),var(--shadow);
  transition:transform .15s;
  cursor:pointer;
}
.nd:active{transform:translateY(2px)}
.nd.l{background:var(--card);color:var(--mut);box-shadow:0 4px 0 var(--bd)}
.nd.d{opacity:.85}
.nd.o{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.08);box-shadow:0 8px 0 rgba(0,0,0,.12),0 0 0 8px rgba(99,102,241,.15)}}
.tabs{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--card);
  backdrop-filter: blur(16px);
  border-top:1px solid var(--bd);
  display:flex;justify-content:space-around;
  padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));
  z-index:9;
  box-shadow:0 -6px 24px rgba(0,0,0,.08);
}
.tabs button{
  background:none;border:0;color:var(--mut);
  font:inherit;font-size:10px;font-weight:700;
  padding:6px 10px;border-radius:16px;cursor:pointer;
  transition:all .2s;
}
.tabs button.on{color:var(--pri);background:rgba(79,70,229,0.12)}
.tabs span{display:block;font-size:22px;margin-bottom:2px}
h1{font-size:24px;margin:12px 0 16px;font-weight:800;letter-spacing:-.3px}
.lb{
  display:flex;align-items:center;gap:14px;width:100%;
  text-align:left;border:1px solid var(--bd);
  background:var(--card);backdrop-filter: blur(10px);color:var(--fg);
  border-radius:20px;padding:18px;margin-bottom:12px;
  font:inherit;font-weight:700;font-size:16px;
  box-shadow:var(--shadow);
  transition:transform .15s,box-shadow .15s;
  cursor:pointer;
}
.lb:active{transform:scale(.98)}
.q{font-size:24px;font-weight:800;margin:12px 0 18px;letter-spacing:-.3px}
.opt{
  display:block;width:100%;text-align:left;
  border:2px solid var(--bd);background:var(--card);backdrop-filter: blur(10px);color:var(--fg);
  border-radius:18px;padding:16px;margin-bottom:12px;
  font:inherit;font-size:17px;font-weight:600;
  box-shadow:var(--shadow);transition:all .15s;
  cursor:pointer;
}
.opt:active{transform:scale(.98)}
.opt.ok,.mt.ok{background:#dcfce7!important;border-color:var(--ok)!important;color:#166534!important}
.opt.no,.mt.no{background:#fee2e2!important;border-color:var(--no)!important;color:#991b1b!important}
.mt{display:block;width:100%;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:14px;padding:14px 8px;margin-bottom:8px;font:inherit;font-weight:600;cursor:pointer}
.btn{
  display:block;width:100%;border:0;
  background:linear-gradient(135deg,var(--pri),#0d9488);
  color:#fff;font:inherit;font-weight:800;
  border-radius:16px;padding:16px;margin-top:16px;
  box-shadow:0 6px 0 var(--pri-dark),var(--shadow);
  transition:transform .1s;
  cursor:pointer;
}
.btn:active{transform:translateY(2px);box-shadow:0 4px 0 var(--pri-dark)}
.btn.g{background:var(--card);color:var(--fg);box-shadow:0 4px 0 var(--bd);border:1px solid var(--bd)}
.snd{border:0;background:var(--card);color:var(--fg);border-radius:50%;width:48px;height:48px;font-size:22px;margin-left:8px;box-shadow:var(--shadow);cursor:pointer}
.fb{margin-top:12px;padding:14px;border-radius:14px;font-weight:700}
.fb.g{background:#dcfce7;color:#166534}
.fb.b{background:#fee2e2;color:#991b1b}
input.in{
  width:100%;font:inherit;font-size:17px;padding:16px 18px;
  border-radius:18px;border:2px solid var(--bd);
  background:var(--card);color:var(--fg);
  box-shadow:var(--shadow);
}
input.in:focus{outline:none;border-color:var(--pri)}
.bub{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;font-size:18px;font-weight:700;margin-bottom:16px;box-shadow:var(--shadow)}
.lk{background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}
.note{color:var(--mut);font-size:13px;margin-top:12px;line-height:1.5}
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.badge-card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.badge-card span{font-size:28px;display:block;margin-bottom:6px}
#sp{
  position:fixed;inset:0;z-index:99;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(160deg,#4f46e5 0%,#7c3aed 50%,#0d9488 100%);
  color:#fff;text-align:center;overflow:hidden;
  transition:opacity .5s;

#sp.h{opacity:0;pointer-events:none}
#sp .lg{width:120px;height:120px;animation:pop .9s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 12px 30px rgba(0,0,0,.35))}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#sp h1{font-size:26px;margin:0}
#sp p{opacity:.9;font-size:15px;max-width:280px}
.splashStart{background:#fff;color:#4f46e5;border:0;padding:14px 32px;font-size:16px;font-weight:800;border-radius:30px;box-shadow:0 10px 25px rgba(0,0,0,0.2);cursor:pointer;margin-top:10px}

function optsFrom(pool, getter, correct){
  var o = pool.map(getter).filter(function(x){ return x && x !== correct; });
  return sh(sh(o).slice(0,3).concat([correct]));
}

function build(tpc, k){
  var lang = S.lang || "en", base = S.base || "tg";
  var pool = tpc.w;
  function pick(w){ return w[K()] || w[1]; }
  function pickBase(w){ return w[B()] || w[0]; }
  if(k===0) return sh(pool.slice()).map(function(w){
    return {t:"ch", p:pickBase(w), a:pick(w), o:optsFrom(pool, pick, pick(w)), s:pick(w)};
  });
  if(k===1) return sh(pool.slice()).map(function(w){
    return {t:"ty", p:pickBase(w), a:pick(w), s:pick(w)};
  });
  if(k===2) return [{t:"ch", p:pickBase(pool[0]), a:pick(pool[0]), o:optsFrom(pool, pick, pick(pool[0])), s:pick(pool[0])}];
  return sh(pool.slice(0,4)).map(function(w){ return {t:"sp", a:pick(w), p:pickBase(w), s:pick(w)}; });
}

function mix(){
  var p = P0(), n = Math.max(1, Math.min(TP.length, Math.floor(p/4))), pool = [];
  TP.slice(0,n).forEach(function(tpc){ pool = pool.concat(tpc.w); });
  return sh(pool).slice(0,5).map(function(w){
    return {t:"ch", p:w[B()], a:w[K()], o:optsFrom(pool, function(x){return x[K()];}, w[K()]), s:w[K()]};
  });
}

/* Speed Quiz Feature */
var speedScore = 0, speedTimer = null, speedLeft = 30;
function startSpeedQuiz(){
  speedScore = 0; speedLeft = 30;
  nextSpeedQuestion();
}
function nextSpeedQuestion(){
  if(speedLeft <= 0) return endSpeedQuiz();
  var pool = TP[0].w;
  var w = pool[Math.floor(Math.random()*pool.length)];
  var ans = w[K()];
  var o = optsFrom(pool, function(x){return x[K()];}, ans);
  
  app.innerHTML = topb() +
    '<h1>⚡ '+t("speedTitle")+'</h1>'+
    '<div class="row"><span>Вақт: <b>'+speedLeft+'с</b></span><span>Хол: <b>'+speedScore+'</b></span></div>'+
    '<div class="q">Тарҷума кунед: <b>'+w[B()]+'</b></div>'+
    o.map(function(x){ return '<button class="opt spd-opt">'+x+'</button>'; }).join('');
  
  if(!speedTimer){
    speedTimer = setInterval(function(){
      speedLeft--;
      if($("app") && tab==="speed") {
        var el = $("app").querySelector(".row");
        if(el) el.innerHTML = '<span>Вақт: <b>'+speedLeft+'с</b></span><span>Хол: <b>'+speedScore+'</b></span>';
      }
      if(speedLeft <= 0){
        clearInterval(speedTimer);
        speedTimer = null;
        endSpeedQuiz();
      }
    }, 1000);
  }
  
  bind(".spd-opt", function(b){
    if(b.textContent === ans) speedScore += 10;
    nextSpeedQuestion();
  });
  $("lg").onclick = function(){ if(speedTimer) clearInterval(speedTimer); speedTimer=null; ob=3; render(); };
}
function endSpeedQuiz(){
  if(speedTimer) { clearInterval(speedTimer); speedTimer = null; }
  S.xp += speedScore; save();
  app.innerHTML = topb() + '<h1>⚡ Вақт тамом шуд!</h1>'+
    '<div class="bub" style="text-align:center">Холгирии шумо: <b>'+speedScore+' XP</b></div>'+
    '<button class="btn" id="reSpd">Бори дигар</button>';

  $("lg").onclick = function(){ ob = 3; render(); };
}

/* Lesson Engine */
var qi, hearts, good, lt, m1;
function startL(qs, meta){
  Q = qs; qi = 0; hearts = 5; good = 0; lt = meta || {}; inL = true;
  tabs(); ask();
}

function bar(){
  return '<div class="top"><button class="lk" id="x">✕</button>'+
         '<div class="bar"><i style="width:'+(qi/Q.length*100)+'%"></i></div>'+
         '<span class="pill">❤️ '+hearts+'</span></div>';

function res(ok, msg, keep){
  if(ok){ if(!m1) good++; }
  else { hearts--; m1 = 1; if(keep) Q.push(Q[qi]); }
  var f = $("f");
  f.innerHTML = '<div class="fb '+(ok?"g":"b")+'">'+msg+'</div><button class="btn" id="nx">'+t("continue")+'</button>';
  $("nx").onclick = function(){ qi++; ask(); };
}

function ask(){
  m1 = 0;
  if(hearts <= 0 || qi >= Q.length) return fin();
  var q = Q[qi], h = bar();

  if(q.t === "ch"){
    h += '<div class="q">'+t("translate")+':<br>'+q.p+'</div>'+
         q.o.map(function(o){ return '<button class="opt">'+o+'</button>'; }).join('')+
         '<div id="f"></div>';
    app.innerHTML = h;
    var lock = 0;
    bind(".opt", function(b){
      if(lock) return; lock = 1;
      var ok = b.textContent === q.a;
      b.classList.add(ok ? "ok" : "no");
      app.querySelectorAll(".opt").forEach(function(o){ if(o.textContent === q.a) o.classList.add("ok"); });
      if(ok) say(q.s);
      res(ok, ok ? t("great") : t("correctIs")+q.a, 1);
    });
  }
  else if(q.t === "ty"){
    h += '<div class="q">'+t("writeIn")+':<br>'+q.p+'</div>'+
         '<input class="in" id="in" autocomplete="off" autocapitalize="off">'+
         '<div id="f"><button class="btn" id="ck">'+t("check")+'</button></div>';
    app.innerHTML = h;
    var chk = function(){
      var ok = nz($("in").value) === nz(q.a);
      $("in").disabled = true;
      if(ok) say(q.s);
      res(ok, ok ? t("great") : t("correctIs")+q.a, 1);
    };
    $("ck").onclick = chk;
    $("in").onkeydown = function(e){ if(e.key === "Enter") chk(); };
    $("in").focus();
  }
  else if(q.t === "sp"){
    h += '<div class="q">'+t("sayIt")+':<br>'+q.a+
         '<button class="snd" id="sn">🔊</button><br>'+
         '<small style="font-size:15px;color:var(--mut)">'+q.p+'</small></div>'+
         '<button class="btn" id="mic">🎤</button>'+
         '<button class="btn g" id="sk">'+t("skip")+'</button><div id="f"></div>';
    app.innerHTML = h;
    $("sn").onclick = function(){ say(q.s); };
    say(q.s);
    $("sk").onclick = function(){ qi++; ask(); };
    $("mic").onclick = function(){
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){
        $("f").innerHTML = '<div class="fb g">'+t("noSpeech")+'</div><button class="btn" id="dn">'+t("iSaid")+'</button>';
        $("dn").onclick = function(){ res(true, t("great")); };
        return;
      }
      var r = new SR(); r.lang = LG[S.lang][2];
      $("mic").textContent = "🎧 "+t("listen");
      r.onresult = function(e){
        var txt = e.results[0][0].transcript;
        var ok = nz(txt).indexOf(nz(q.a)) >= 0;
        $("mic").style.display = "none";
        res(ok, ok ? t("great") : t("correctIs")+q.a);
      };
      r.onerror = function(){ $("mic").textContent = "🎤 "+t("speakAgain"); };
      r.start();
    };
  }
  $("x").onclick = function(){ Q = null; render(); };
}

function fin(){
  var win = hearts > 0;
  var xp = win ? good*5 + 10 : 0;
  if(win){
    S.xp += xp; S.tx += xp;
    if(S.last !== day()){
      S.streak = (S.last === day(1)) ? S.streak + 1 : 1;
      S.last = day();

    if(lt.node !== undefined && lt.node === P0()) S.p[PK()] = lt.node + 1;

  var sp = $("sp"), started = false;
  function off(){ sp.classList.add("h"); setTimeout(function(){ sp.style.display = "none"; }, 350); }
  function enter(e){ if(started) return; started = true; off(); }
  var btn = $("startExperience");
  if(btn) btn.addEventListener("click", enter);
  sp.addEventListener("click", enter);
  setTimeout(function(){ if(!started){ started = true; off(); } }, 6000);
})();

render();
</script>
</body>
</html>
