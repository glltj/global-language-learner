<style>
:root{
  --bg:#f1f5f9;
  --fg:#0f172a;
  --mut:#64748b;
  --card:#ffffff;
  --bd:#e2e8f0;
  --pri:#4f46e5;
  --pri-dark:#4f46e5;
  --ok:#22c55e;
  --no:#ef4444;
  --shadow:0 4px 20px rgba(0,0,0,.08);
  --shadow-lg:0 10px 40px rgba(0,0,0,.12);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f172a;--fg:#f1f5f9;--mut:#94a3b8;--card:#1e293b;--bd:#334155;
    --shadow:0 4px 20px rgba(0,0,0,.3);--shadow-lg:0 10px 40px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f172a;--fg:#f1f5f9;--mut:#94a3b8;--card:#1e293b;--bd:#334155;
  --shadow:0 4px 20px rgba(0,0,0,.3);--shadow-lg:0 10px 40px rgba(0,0,0,.4);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
main{max-width:480px;margin:0 auto;padding:16px 16px 110px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pill{
  background:var(--card);
  border-radius:24px;
  padding:8px 14px;
  font-weight:700;
  white-space:nowrap;
  border:1px solid var(--bd);
  color:var(--fg);
  font-size:14px;
  box-shadow:var(--shadow);
}
.sp{flex:1}
.mh{
  color:#fff;
  border-radius:20px;
  padding:16px 18px;
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  margin-bottom:12px;
  box-shadow:var(--shadow-lg);
}
.mh small{opacity:.9;font-weight:700;font-size:12px;letter-spacing:.5px}
.mh b{display:block;font-size:20px;margin-top:2px}
.gl{font-size:13px;color:var(--mut);margin:8px 0 6px;font-weight:600}
.bar{height:10px;background:var(--card);border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#8b5cf6);transition:width .4s ease}
.dv{text-align:center;color:var(--mut);font-weight:700;margin:28px 0 14px;font-size:13px;letter-spacing:.5px}
.nr{display:flex;justify-content:center;margin:14px 0}
.nd{
  width:72px;height:72px;border-radius:50%;border:0;
  background:var(--c);color:#fff;font-size:30px;
  box-shadow:0 6px 0 rgba(0,0,0,.15),var(--shadow);
  transition:transform .15s;
}
.nd:active{transform:translateY(2px)}
.nd.l{background:var(--card);color:var(--mut);box-shadow:0 4px 0 var(--bd)}
.nd.d{opacity:.65}
.nd.o{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.08);box-shadow:0 8px 0 rgba(0,0,0,.12),0 0 0 8px rgba(99,102,241,.15)}}
.tabs{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--card);
  border-top:1px solid var(--bd);
  display:flex;justify-content:space-around;
  padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));
  z-index:9;
  box-shadow:0 -4px 20px rgba(0,0,0,.06);
}
.tabs button{
  background:none;border:0;color:var(--mut);
  font:inherit;font-size:11px;font-weight:700;
  padding:6px 12px;border-radius:16px;
}
.tabs button.on{color:var(--pri);background:rgba(99,102,241,.1)}
.tabs span{display:block;font-size:24px;margin-bottom:2px}
h1{font-size:24px;margin:12px 0 16px;font-weight:800;letter-spacing:-.3px}
.lb{
  display:flex;align-items:center;gap:14px;width:100%;
  text-align:left;border:1px solid #e0e7ff;
  background:linear-gradient(135deg,#ffffff,#f8fafc);color:var(--fg);
  border-radius:20px;padding:18px;margin-bottom:12px;
  font:inherit;font-weight:700;font-size:17px;
  box-shadow:0 2px 8px rgba(99,102,241,.08);
  transition:transform .15s,box-shadow .15s;
}
.lb:active{transform:scale(.98)}
.q{font-size:26px;font-weight:800;margin:12px 0 18px;letter-spacing:-.3px}
.opt{
  display:block;width:100%;text-align:left;
  border:2px solid #e0e7ff;background:#ffffff;color:var(--fg);
  border-radius:18px;padding:18px;margin-bottom:12px;
  font:inherit;font-size:18px;font-weight:600;
  box-shadow:0 2px 6px rgba(0,0,0,.04);transition:all .15s;
}
.opt:active{transform:scale(.98)}
.opt.ok,.mt.ok{background:#dcfce7;border-color:var(--ok);color:#166534}
.opt.no,.mt.no{background:#fee2e2;border-color:var(--no);color:#991b1b}
.mt.sel{border-color:var(--pri);background:rgba(99,102,241,.08)}
.mt{display:block;width:100%;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:14px;padding:14px 8px;margin-bottom:8px;font:inherit;font-weight:600}
.btn{
  display:block;width:100%;border:0;
  background:linear-gradient(135deg,var(--pri),#8b5cf6);
  color:#fff;font:inherit;font-weight:800;
  border-radius:16px;padding:16px;margin-top:16px;
  box-shadow:0 6px 0 var(--pri-dark),var(--shadow);
  transition:transform .1s;
}
.btn:active{transform:translateY(2px);box-shadow:0 4px 0 var(--pri-dark)}
.btn.g{background:var(--card);color:var(--fg);box-shadow:0 4px 0 var(--bd);border:1px solid var(--bd)}
.snd{border:0;background:var(--card);color:var(--fg);border-radius:50%;width:48px;height:48px;font-size:22px;margin-left:8px;box-shadow:var(--shadow)}
.fb{margin-top:12px;padding:14px;border-radius:14px;font-weight:700}
.fb.g{background:#dcfce7;color:#166534}
.fb.b{background:#fee2e2;color:#991b1b}
input.in{
  width:100%;font:inherit;font-size:17px;padding:16px 18px;
  border-radius:18px;border:2px solid #c7d2fe;
  background:#ffffff;color:var(--fg);
  box-shadow:0 2px 8px rgba(79,70,229,.08);
}
input.in:focus{outline:none;border-color:var(--pri)}
.ans,.tl{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px 0}
.ans{border-bottom:2px solid var(--bd);margin-bottom:12px}
.tk{border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:14px;padding:12px 16px;font:inherit;font-size:18px;font-weight:600;box-shadow:var(--shadow)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bub{background:var(--card);border-radius:20px;padding:16px;font-size:20px;font-weight:700;margin-bottom:16px;box-shadow:var(--shadow)}
.lk{background:none;border:0;color:var(--mut);font-size:22px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}
.note{color:var(--mut);font-size:13px;margin-top:16px;line-height:1.5}
#sp{
  position:fixed;inset:0;z-index:99;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:linear-gradient(160deg,#4f46e5 0%,#7c3aed 50%,#0d9488 100%);
  color:#fff;text-align:center;overflow:hidden;
  transition:opacity .5s;
}
#sp.h{opacity:0;pointer-events:none}
#sp .lg{width:130px;height:130px;animation:pop .9s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 12px 30px rgba(0,0,0,.35))}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
#sp h1{font-size:28px;margin:0;letter-spacing:-.5px}
#sp p{opacity:.9;font-size:16px;max-width:280px}
</style>
</head>

/* ===================== LESSON GENERATORS ===================== */
function opts(pool, col, a){
  var o = pool.map(function(w){ return w[col]; }).filter(function(x,i,r){ return x !== a && r.indexOf(x) === i; });
  return sh(sh(o).slice(0,3).concat([a]));
}
function mkCh(w, pool){
  var k = K(), v = Math.floor(Math.random()*3);
  if(v===2 && !window.speechSynthesis) v = 1;
  if(v===0) return {t:"ch", p:w[B()], a:w[k], o:opts(pool,k,w[k]), s:w[k]};
  if(v===1) return {t:"ch", p:w[k], a:w[B()], o:opts(pool,B(),w[B()]), s:w[k], sp:1};
  return {t:"ch", p:t("whatHeard"), a:w[B()], o:opts(pool,B(),w[B()]), s:w[k], sp:1, au:1};
}
function mkTy(w){ return {t:"ty", p:w[B()], a:w[K()], s:w[K()]}; }
function mkPz(ph){ return {t:"pz", p:ph[B()], a:ph[K()], toks:ph[K()].split(" ")}; }
function mkMt(ws){ return {t:"mt", ws:ws}; }

function wordArr(w){
  // Prefer DICT-style object if available, else old array
  if(w && w.en) return w;
  return null;
}
function getW(lang, fallback){
  return function(w){
    if(typeof w === "object" && !Array.isArray(w)) return w[lang] || w.en || fallback || "";
    return w[K()] || "";
  };
}
function build(tpc, k){
  var lang = S.lang || "en";
  var base = S.base || "tg";
  // Use DICT if learning language is not in old lesson arrays
  var useDict = CONTENT_ORDER.indexOf(lang) < 0;
  var pool = useDict ? DICT.filter(function(w){ return w[lang] || w.en; }).slice(0, 12) : tpc.w;
  if(!pool.length) pool = tpc.w;
  function pick(w){ return (typeof w === "object" && !Array.isArray(w)) ? (w[lang] || w.en || "") : w[K()]; }
  function pickBase(w){ return (typeof w === "object" && !Array.isArray(w)) ? (w[base] || w.tg || w.en || "") : w[B()]; }
  if(k===0) return sh(pool.slice()).map(function(w){
    return {t:"ch", p:pickBase(w), a:pick(w), o:optsFrom(pool, pick, pick(w)), s:pick(w)};
  });
  if(k===1) return sh(pool.slice()).map(function(w){
    return {t:"ty", p:pickBase(w), a:pick(w), s:pick(w)};
  });
  if(k===2) return [ {t:"mt", ws: pool.slice(0,4).map(function(w){ return [pickBase(w), pick(w)]; }) } ]
    .concat(sh(pool.slice(0,2)).map(function(w){ return {t:"ch", p:pickBase(w), a:pick(w), o:optsFrom(pool, pick, pick(w)), s:pick(w)}; }));
  return sh(pool.slice(0,5)).map(function(w){ return {t:"sp", a:pick(w), p:pickBase(w), s:pick(w)}; });
}
function optsFrom(pool, getter, correct){
  var o = pool.map(getter).filter(function(x){ return x && x !== correct; });
  return sh(sh(o).slice(0,3).concat([correct]));
}

function mix(){
  var p = P0(), n = Math.max(1, Math.min(TP.length, Math.floor(p/4))), pool = [];
  TP.slice(0,n).forEach(function(tpc){ pool = pool.concat(tpc.w); });
  var q = sh(pool).slice(0,6).map(function(w,i){ return i%2 ? mkTy(w) : mkCh(w,pool); });
  return sh(q);
}

function dlg(){
  // simple dialogue placeholder
  return [
    {t:"ch", p:"Салом!", a:"Салом", o:["Салом","Хайр","Раҳмат","Бале"], s:"Салом"}
  ];
}

var qi, hearts, good, lt, m1;

function startL(qs, meta){
  Q = qs; qi = 0; hearts = 5; good = 0; lt = meta || {}; inL = true;
  tabs();
  ask();
}

function bar(){
  return '<div class="top"><button class="lk" id="x">✕</button>'+
         '<div class="bar"><i style="width:'+(qi/Q.length*100)+'%"></i></div>'+
         '<span class="pill">❤️ '+hearts+'</span></div>';
}

function res(ok, msg, keep){
  if(ok){ if(!m1) good++; }
  else { hearts--; m1 = 1; if(keep) Q.push(Q[qi]); }
  var f = $("f");
  f.innerHTML = '<div class="fb '+(ok?"g":"b")+'">'+msg+'</div><button class="btn" id="nx">'+t("continue")+'</button>';
  $("nx").onclick = function(){ qi++; ask(); };
}

function ask(){
  m1 = 0;
  if(hearts <= 0 || qi >= Q.length) return fin();
  var q = Q[qi], h = bar();

  if(q.t === "ch"){
    h += '<div class="q">'+(q.au ? t("whatHeard") : (q.sp ? t("translate")+':<br>' : t("translate")+':<br>')+q.p)+
         (q.sp ? '<button class="snd" id="sn">🔊</button>' : '')+'</div>'+
         q.o.map(function(o){ return '<button class="opt">'+o+'</button>'; }).join('')+
         '<div id="f"></div>';
    app.innerHTML = h;
    if($("sn")) $("sn").onclick = function(){ say(q.s); };
    if(q.au) say(q.s);
    var lock = 0;
    bind(".opt", function(b){
      if(lock) return; lock = 1;
      var ok = b.textContent === q.a;
      b.classList.add(ok ? "ok" : "no");
      app.querySelectorAll(".opt").forEach(function(o){ if(o.textContent === q.a) o.classList.add("ok"); });
      if(ok) say(q.s);
      res(ok, ok ? t("great") : t("correctIs")+q.a, 1);
    });
  }
  else if(q.t === "ty"){
    h += '<div class="q">'+t("writeIn")+':<br>'+q.p+'</div>'+
         '<input class="in" id="in" autocomplete="off" autocapitalize="off">'+
         '<div id="f"><button class="btn" id="ck">'+t("check")+'</button></div>';
    app.innerHTML = h;
    var chk = function(){
      var ok = nz($("in").value) === nz(q.a);
      $("in").disabled = true;
      if(ok) say(q.s);
      res(ok, ok ? t("great") : t("correctIs")+q.a, 1);
    };
    $("ck").onclick = chk;
    $("in").onkeydown = function(e){ if(e.key === "Enter") chk(); };
    $("in").focus();
  }
  else if(q.t === "sp"){
    h += '<div class="q">'+t("sayIt")+':<br>'+q.a+
         '<button class="snd" id="sn">🔊</button><br>'+
         '<small style="font-size:15px;color:var(--mut)">'+q.p+'</small></div>'+
         '<button class="btn" id="mic">🎤</button>'+
         '<button class="btn g" id="sk">'+t("skip")+'</button><div id="f"></div>';
    app.innerHTML = h;
    $("sn").onclick = function(){ say(q.s); };
    say(q.s);
    $("sk").onclick = function(){ qi++; ask(); };
    $("mic").onclick = function(){
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){
        $("f").innerHTML = '<div class="fb g">'+t("noSpeech")+'</div><button class="btn" id="dn">'+t("iSaid")+'</button>';
        $("dn").onclick = function(){ res(true, t("great")); };
        return;
      }
      var r = new SR();
      r.lang = LG[S.lang][2];
      $("mic").textContent = "🎧 "+t("listen");
      r.onresult = function(e){
        var txt = e.results[0][0].transcript;
        var ok = nz(txt).indexOf(nz(q.a)) >= 0 || (nz(q.a).indexOf(nz(txt)) >= 0 && nz(txt).length > 0);
        $("mic").style.display = "none";
        res(ok, ok ? t("great") : t("correctIs")+q.a);
      };
      r.onerror = function(){ $("mic").textContent = "🎤 "+t("speakAgain"); };
      r.start();
    };
  }
  else {
    // fallback
    res(true, t("great"));
  }

  $("x").onclick = function(){ Q = null; render(); };
}

function fin(){
  var win = hearts > 0;
  var xp = win ? good*5 + 5 : 0;
  if(win){
    S.xp += xp; S.tx += xp;
    if(S.last !== day()){
      S.streak = (S.last === day(1)) ? S.streak + 1 : 1;
      S.last = day();
    }
    if(lt.node !== undefined && lt.node === P0()) S.p[PK()] = lt.node + 1;
  }
  save();
  app.innerHTML = '<h1 style="text-align:center;margin-top:60px">'+(win ? t("lessonDone") : t("heartsOut"))+'</h1>'+
    '<p style="text-align:center">'+(win ? '<b>+'+xp+' XP</b> · 🔥 '+S.streak : t("tryAgain"))+'</p>'+
    '<button class="btn" id="ok">'+t("continue")+'</button>';
  $("ok").onclick = function(){ Q = null; render(); };
}

function showAlpha(){
  var lang = S.lang || "en";
  var letters = ALPHA[lang] || ALPHA.en;
  var h = topb() + '<h1>Алфавит · '+langName(lang)+'</h1><p class="note">Ҳарф · Талаффуз</p>';
  letters.forEach(function(l){
    h += '<div class="lb" style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:22px">'+l[0]+' '+l[1]+'</b><span style="color:var(--mut)">'+l[2]+'</span></div>';
  });
  h += '<button class="btn g" id="backDict" style="margin-top:20px">← Луғат</button>';
  app.innerHTML = h;
  $("backDict").onclick = showDict;
  $("lg").onclick = function(){ ob = 3; render(); };
}

function showDict(){
  var base = S.base || "tg";
  var learn = S.lang || "en";
  var q = "";
  function draw(filter){
    var list = DICT.filter(function(w){
      if(!filter) return true;
      var f = filter.toLowerCase();
      return (w[learn]||"").toLowerCase().indexOf(f) >= 0 || (w[base]||"").toLowerCase().indexOf(f) >= 0;
    });
    var h = topb() +
      '<h1>'+t("dictTitle")+'</h1>'+
      '<button class="pill" id="alphaBtn" style="margin-bottom:12px">🔤 Алфавит</button>'+
      '<input class="in" id="ds" placeholder="'+t("dictSearch")+'" value="'+(filter||'')+'">'+
      '<p class="note">'+list.length+' '+t("dictWords")+'</p>';
    if(list.length === 0){
      h += '<p style="text-align:center;color:var(--mut);margin-top:40px">'+t("dictNoResults")+'</p>';
    } else {
      list.forEach(function(w){
        var target = w[learn] || w.en || w.tg || "—";
        var native = w[base] || w.en || w.tg || "—";
        h += '<div class="lb" style="display:block;margin-bottom:8px">'+
             '<b style="font-size:18px">'+target+'</b>'+
             '<div style="color:var(--mut);margin-top:4px">'+native+'</div></div>';
      });
    }
    app.innerHTML = h;
    var inp = $("ds");
    if(inp){
      inp.focus();
      inp.oninput = function(){ draw(inp.value); };
    }
    $("alphaBtn").onclick = showAlpha;
    $("lg").onclick = function(){ ob = 3; render(); };
  }
  draw("");
}

  var tmr = setInterval(function(){ i = (i+1)%G.length; g.textContent = G[i]; }, 850);

  function welcome(){
    var k = (S && S.base && LG[S.base]) ? S.base : "tg";
    var words = {
      tg: "Хуш омадед! Омӯзишро оғоз мекунем.",
      en: "Welcome! Let's start learning.",
      ru: "Добро пожаловать! Начнём обучение.",
      tr: "Hoş geldiniz! Öğrenmeye başlayalım.",
      zh: "欢迎！让我们开始学习。",
      ko: "환영합니다! 함께 공부를 시작해요."
    };
    try{
      if(window.speechSynthesis){
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(words[k] || words.tg);
        u.lang = LG[k][2];
        u.rate = 0.92;
        speechSynthesis.speak(u);
      }
    }catch(e){}
  }

  function off(){
    clearInterval(tmr);
    sp.classList.add("h");
    setTimeout(function(){ sp.style.display = "none"; }, 350);
  }

  function enter(e){
    if(e) e.stopPropagation();
    if(started) return;
    started = true;
    welcome();
    off();
  }

  var btn = $("startExperience");
  if(btn) btn.addEventListener("click", enter);
  sp.addEventListener("click", enter);
  setTimeout(function(){ if(!started){ started = true; off(); } }, 10000);
})();

render();
</script>
</body>
</html>
