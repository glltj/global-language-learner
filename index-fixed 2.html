:root{--bg:#fff;--fg:#1e1b4b;--mut:#6b7280;--card:#f1f5f9;--bd:#e2e8f0;--pri:#6366f1;--ok:#bbf7d0;--no:#fecaca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:12px 16px 100px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top .bar{flex:1}
.pill{background:var(--card);border-radius:20px;padding:6px 12px;font-weight:700;white-space:nowrap;border:0;color:var(--fg);font-size:inherit}
.sp{flex:1}
.mh{color:#fff;border-radius:16px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-bottom:8px}.mh small{opacity:.85;font-weight:700}.mh b{display:block;font-size:18px}
.gl{font-size:13px;color:var(--mut);margin:6px 0}
.bar{height:12px;background:var(--card);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .3s}
.dv{text-align:center;color:var(--mut);font-weight:700;margin:22px 0 10px;border-top:2px solid var(--bd);padding-top:10px}
.nr{display:flex;justify-content:center;margin:12px 0}
.nd{width:68px;height:68px;border-radius:50%;border:0;border-bottom:6px solid rgba(0,0,0,.25);background:var(--c);color:#fff;font-size:28px}
.nd.l{background:var(--card);color:var(--mut);border-bottom-color:var(--bd)}.nd.d{opacity:.7}
.nd.o{animation:pl 1.4s infinite}@keyframes pl{50%{transform:scale(1.1)}}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:9}
.tabs button{background:none;border:0;color:var(--mut);font:inherit;font-size:12px;font-weight:700;padding:4px 10px;border-radius:12px}.tabs button.on{color:var(--pri);background:var(--card)}.tabs span{display:block;font-size:22px}
h1{font-size:22px;margin:8px 0 12px}
.lb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:16px;padding:14px;margin-bottom:10px;font:inherit;font-weight:700;font-size:17px}
.q{font-size:24px;font-weight:800;margin:10px 0 16px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;font-size:18px}
.opt.ok,.mt.ok{background:var(--ok);border-color:#22c55e}.opt.no,.mt.no{background:var(--no);border-color:#ef4444}.mt.sel{border-color:var(--pri)}.mt{display:block;width:100%;border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:12px 6px;margin-bottom:8px;font:inherit}
.btn{display:block;width:100%;border:0;border-bottom:4px solid rgba(0,0,0,.25);background:var(--pri);color:#fff;font:inherit;font-weight:800;border-radius:14px;padding:14px;margin-top:12px}.btn.g{background:var(--card);color:var(--fg);border-bottom-color:var(--bd)}
.snd{border:0;background:var(--card);color:var(--fg);border-radius:50%;width:46px;height:46px;font-size:22px;margin-left:8px}
.fb{margin-top:10px;padding:12px;border-radius:12px;font-weight:700}.fb.g{background:var(--ok)}.fb.b{background:var(--no)}
input.in{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--fg)}
.ans,.tl{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px 0}.ans{border-bottom:2px solid var(--bd);margin-bottom:10px}
.tk{border:2px solid var(--bd);background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;font:inherit;font-size:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bub{background:var(--card);border-radius:16px;padding:14px;font-size:20px;font-weight:700;margin-bottom:14px}
.lk{background:none;border:0;color:var(--mut);font-size:20px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
.note{color:var(--mut);font-size:13px;margin-top:16px}

#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(160deg,#4f46e5,#0d9488);color:#fff;text-align:center;overflow:hidden;transition:opacity .5s}
#sp.h{opacity:0;pointer-events:none}
#sp .lg{width:120px;height:120px;animation:pop .8s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 8px 20px rgba(0,0,0,.3))}
#sp .lg svg{width:100%;height:100%}
#sp h2{margin:0;font-size:26px;animation:up .8s .3s both}
#gr{font-size:22px;font-weight:700;height:30px;animation:up .8s .5s both}
#sp small{opacity:.75;animation:up .8s .7s both}
.fl{position:absolute;bottom:-40px;font-size:34px;opacity:.85;animation:fy 4s linear infinite}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fy{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
.lgo{width:34px;height:34px;flex:none}.lgo svg{width:100%;height:100%}

/* GLOBAL PRO DESIGN LAYER */
:root{--pri:#635bff;--card:#f7f8ff;--bd:#e8e9f4;--fg:#171936;--mut:#737895}
body{background:radial-gradient(ellipse at 12% 0%,rgba(99,91,255,.10),transparent 36%),radial-gradient(ellipse at 90% 18%,rgba(13,148,136,.09),transparent 32%),var(--bg);letter-spacing:-.01em}
main{max-width:620px;padding:18px 18px 112px}
.top{gap:9px;margin:5px 0 16px}
.pill{box-shadow:0 5px 18px rgba(25,30,80,.06);border:1px solid var(--bd)}
.mh{border-radius:24px;padding:20px 19px;box-shadow:0 14px 34px rgba(50,50,110,.15);background-image:linear-gradient(120deg,rgba(255,255,255,.15),transparent 60%)}
.mh b{font-size:21px;margin-top:5px}
.bar{height:13px;border:1px solid var(--bd)}
.bar i{background:linear-gradient(90deg,#625bff,#16b8a6);border-radius:8px}
.dv{border:0;text-align:left;margin:25px 0 8px;padding:10px 14px;border-radius:13px;background:var(--card);color:var(--fg)}
.nd{width:72px;height:72px;border-radius:24px;border:1px solid rgba(255,255,255,.22);border-bottom:5px solid rgba(0,0,0,.17);box-shadow:0 8px 20px rgba(25,30,80,.12);font-size:27px}
.nd.l{box-shadow:none;border:2px dashed var(--bd)}
.lb,.opt,.mt{border-radius:18px;box-shadow:0 5px 16px rgba(25,30,80,.045);transition:transform .16s,border-color .16s,box-shadow .16s}
.lb:active,.opt:active,.btn:active,.nd:active{transform:scale(.975)}
.lb{padding:16px;border-width:1.5px;background:linear-gradient(135deg,var(--card),var(--bg))}
.opt{padding:16px;border-width:1.5px;font-weight:650}
.btn{border-radius:17px;padding:16px;background:linear-gradient(110deg,#625bff,#4f46e5);box-shadow:0 9px 20px rgba(99,91,255,.22);border-bottom:4px solid rgba(0,0,0,.2)}
.btn.g{box-shadow:none}
.tabs{backdrop-filter:blur(18px);background:color-mix(in srgb,var(--bg) 86%,transparent);border-top:1px solid var(--bd);box-shadow:0 -8px 28px rgba(20,25,70,.06);padding-top:9px}
.tabs button{min-width:64px;padding:6px 12px;border-radius:14px}
.tabs button.on{background:rgba(99,91,255,.12)}
h1{font-size:25px;letter-spacing:-.04em;margin:13px 0 14px}
.q{font-size:26px;line-height:1.25;letter-spacing:-.035em}
.bub{border:1px solid var(--bd);border-radius:20px;padding:18px;box-shadow:0 8px 22px rgba(25,30,80,.05)}
.note{line-height:1.55}
#sp{background:radial-gradient(circle at 50% 32%,rgba(255,255,255,.23),transparent 30%),linear-gradient(145deg,#28236f 0%,#5147d9 48%,#078c86 100%);gap:17px}
#sp:before,#sp:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.15);border-radius:50%;width:330px;height:330px;animation:orbit 18s linear infinite}
#sp:after{width:470px;height:470px;animation-direction:reverse;animation-duration:26s}
#sp .lg{z-index:1;width:132px;height:132px;filter:drop-shadow(0 15px 28px rgba(0,0,0,.28))}
#sp h2,#gr,#sp small,#startExperience{z-index:1}
#sp h2{font-size:28px;letter-spacing:-.04em}
#gr{font-size:21px}
.splashStart{margin-top:10px;border:1px solid rgba(255,255,255,.42);border-radius:999px;padding:14px 25px;background:rgba(255,255,255,.16);color:#fff;font-weight:850;letter-spacing:.08em;backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.12)}
.fl{filter:drop-shadow(0 5px 8px rgba(0,0,0,.12))}
@keyframes orbit{to{transform:rotate(360deg) scale(1.08)}}
@media(min-width:700px){main{padding-top:28px}.tabs{left:50%;right:auto;transform:translateX(-50%);width:min(620px,100%);border-radius:22px 22px 0 0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}

/* ===================== LESSON GENERATORS ===================== */
function opts(pool, col, a){
  var o = pool.map(function(w){ return w[col]; }).filter(function(x,i,r){ return x !== a && r.indexOf(x) === i; });
  return sh(sh(o).slice(0,3).concat([a]));
}
function mkCh(w, pool){
  var k = K(), v = Math.floor(Math.random()*3);
  if(v===2 && !window.speechSynthesis) v = 1;
  if(v===0) return {t:"ch", p:w[B()], a:w[k], o:opts(pool,k,w[k]), s:w[k]};
  if(v===1) return {t:"ch", p:w[k], a:w[B()], o:opts(pool,B(),w[B()]), s:w[k], sp:1};
  return {t:"ch", p:t("whatHeard"), a:w[B()], o:opts(pool,B(),w[B()]), s:w[k], sp:1, au:1};
}
function mkTy(w){ return {t:"ty", p:w[B()], a:w[K()], s:w[K()]}; }
function mkPz(ph){ return {t:"pz", p:ph[B()], a:ph[K()], toks:ph[K()].split(" ")}; }
function mkMt(ws){ return {t:"mt", ws:ws}; }

function build(tpc, k){
  var w = tpc.w;
  if(k===0) return sh(w).map(function(x){ return mkCh(x,w); });
  if(k===1) return sh(w).map(mkTy);
  if(k===2) return [mkMt(sh(w).slice(0,4))].concat(sh(w).slice(0,2).map(function(x){ return mkCh(x,w); }));
  return sh(w).slice(0,5).map(function(x){ return {t:"sp", a:x[K()], p:x[B()], s:x[K()]}; });
}

function mix(){
  var p = P0(), n = Math.max(1, Math.min(TP.length, Math.floor(p/4))), pool = [];
  TP.slice(0,n).forEach(function(tpc){ pool = pool.concat(tpc.w); });
  var q = sh(pool).slice(0,6).map(function(w,i){ return i%2 ? mkTy(w) : mkCh(w,pool); });
  return sh(q);
}

         '<span class="pill">❤️ '+hearts+'</span></div>';
}

function res(ok, msg, keep){
  if(ok){ if(!m1) good++; }
  else { hearts--; m1 = 1; if(keep) Q.push(Q[qi]); }
  var f = $("f");
  f.innerHTML = '<div class="fb '+(ok?"g":"b")+'">'+msg+'</div><button class="btn" id="nx">'+t("continue")+'</button>';
  $("nx").onclick = function(){ qi++; ask(); };
}

function ask(){
  m1 = 0;
  if(hearts <= 0 || qi >= Q.length) return fin();
  var q = Q[qi], h = bar();

  if(q.t === "ch"){
    h += '<div class="q">'+(q.au ? t("whatHeard") : (q.sp ? t("translate")+':<br>' : t("translate")+':<br>')+q.p)+
         (q.sp ? '<button class="snd" id="sn">🔊</button>' : '')+'</div>'+
         q.o.map(function(o){ return '<button class="opt">'+o+'</button>'; }).join('')+
         '<div id="f"></div>';
    app.innerHTML = h;
    if($("sn")) $("sn").onclick = function(){ say(q.s); };
    if(q.au) say(q.s);
    var lock = 0;
    bind(".opt", function(b){
      if(lock) return; lock = 1;
      var ok = b.textContent === q.a;
      b.classList.add(ok ? "ok" : "no");
      app.querySelectorAll(".opt").forEach(function(o){ if(o.textContent === q.a) o.classList.add("ok"); });
      if(ok) say(q.s);
      res(ok, ok ? t("great") : t("correctIs")+q.a, 1);
    });
  }
  else if(q.t === "ty"){
    h += '<div class="q">'+t("writeIn")+':<br>'+q.p+'</div>'+
         '<input class="in" id="in" autocomplete="off" autocapitalize="off">'+
         '<div id="f"><button class="btn" id="ck">'+t("check")+'</button></div>';
    app.innerHTML = h;
    var chk = function(){
      var ok = nz($("in").value) === nz(q.a);
      $("in").disabled = true;
      if(ok) say(q.s);
      res(ok, ok ? t("great") : t("correctIs")+q.a, 1);
    };
    $("ck").onclick = chk;
    $("in").onkeydown = function(e){ if(e.key === "Enter") chk(); };
    $("in").focus();
  }
  else if(q.t === "sp"){
    h += '<div class="q">'+t("sayIt")+':<br>'+q.a+
         '<button class="snd" id="sn">🔊</button><br>'+
         '<small style="font-size:15px;color:var(--mut)">'+q.p+'</small></div>'+
         '<button class="btn" id="mic">🎤</button>'+
         '<button class="btn g" id="sk">'+t("skip")+'</button><div id="f"></div>';
    app.innerHTML = h;
    $("sn").onclick = function(){ say(q.s); };
    say(q.s);
    $("sk").onclick = function(){ qi++; ask(); };
    $("mic").onclick = function(){
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(!SR){
        $("f").innerHTML = '<div class="fb g">'+t("noSpeech")+'</div><button class="btn" id="dn">'+t("iSaid")+'</button>';
        $("dn").onclick = function(){ res(true, t("great")); };
        return;
      }
      var r = new SR();
      r.lang = LG[S.lang][2];
      $("mic").textContent = "🎧 "+t("listen");
      r.onresult = function(e){
        var txt = e.results[0][0].transcript;
        var ok = nz(txt).indexOf(nz(q.a)) >= 0 || (nz(q.a).indexOf(nz(txt)) >= 0 && nz(txt).length > 0);
        $("mic").style.display = "none";
        res(ok, ok ? t("great") : t("correctIs")+q.a);
      };
      r.onerror = function(){ $("mic").textContent = "🎤 "+t("speakAgain"); };
      r.start();
    };
  }
  else {
    // fallback
    res(true, t("great"));
  }

  $("x").onclick = function(){ Q = null; render(); };
}

function fin(){
  var win = hearts > 0;
  var xp = win ? good*5 + 5 : 0;
  if(win){
    S.xp += xp; S.tx += xp;
    if(S.last !== day()){
      S.streak = (S.last === day(1)) ? S.streak + 1 : 1;
      S.last = day();
    }
    if(lt.node !== undefined && lt.node === P0()) S.p[PK()] = lt.node + 1;
  }
  save();
  app.innerHTML = '<h1 style="text-align:center;margin-top:60px">'+(win ? t("lessonDone") : t("heartsOut"))+'</h1>'+
    '<p style="text-align:center">'+(win ? '<b>+'+xp+' XP</b> · 🔥 '+S.streak : t("tryAgain"))+'</p>'+
    '<button class="btn" id="ok">'+t("continue")+'</button>';
  $("ok").onclick = function(){ Q = null; render(); };
}

function showDict(){
  var base = S.base || "tg";
  var learn = S.lang || "en";
  var q = "";
  function draw(filter){
    var list = DICT.filter(function(w){
      if(!filter) return true;
      var f = filter.toLowerCase();
      return (w[learn]||"").toLowerCase().indexOf(f) >= 0 || (w[base]||"").toLowerCase().indexOf(f) >= 0;
    });
    var h = topb() +
      '<h1>'+t("dictTitle")+'</h1>'+
      '<input class="in" id="ds" placeholder="'+t("dictSearch")+'" value="'+filter+'">'+
      '<p class="note">'+list.length+' '+t("dictWords")+'</p>';
    if(list.length === 0){
      h += '<p style="text-align:center;color:var(--mut);margin-top:40px">'+t("dictNoResults")+'</p>';
    } else {
      list.forEach(function(w){
        var target = w[learn] || "—";
        var native = w[base] || "—";
        h += '<div class="lb" style="display:block;margin-bottom:8px">'+
             '<b style="font-size:18px">'+target+'</b>'+
             '<div style="color:var(--mut);margin-top:4px">'+native+'</div></div>';
      });
    }
    app.innerHTML = h;
    var inp = $("ds");
    if(inp){
      inp.focus();
      inp.oninput = function(){ draw(inp.value); };
    }
    $("lg").onclick = function(){ ob = 3; render(); };
  }
  draw("");
}

/* ===================== SPLASH ===================== */
(function(){
  var G = ["Салом","Hello","Привет","Merhaba","你好","안녕하세요","Welcome"];
  var i = 0, sp = $("sp"), g = $("gr"), started = false;
  var tmr = setInterval(function(){ i = (i+1)%G.length; g.textContent = G[i]; }, 850);

  function welcome(){
    var k = (S && S.base && LG[S.base]) ? S.base : "tg";
    var words = {
      tg: "Хуш омадед! Омӯзишро оғоз мекунем.",
      en: "Welcome! Let's start learning.",
      ru: "Добро пожаловать! Начнём обучение.",
      tr: "Hoş geldiniz! Öğrenmeye başlayalım.",
      zh: "欢迎！让我们开始学习。",
      ko: "환영합니다! 함께 공부를 시작해요."
    };
    try{
      if(window.speechSynthesis){
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(words[k] || words.tg);
        u.lang = LG[k][2];
        u.rate = 0.92;
        speechSynthesis.speak(u);
      }
    }catch(e){}
  }

  function off(){
    clearInterval(tmr);
    sp.classList.add("h");
    setTimeout(function(){ sp.style.display = "none"; }, 350);
  }

  function enter(e){
    if(e) e.stopPropagation();
    if(started) return;
    started = true;
    welcome();
    off();
  }

  var btn = $("startExperience");
  if(btn) btn.addEventListener("click", enter);
  sp.addEventListener("click", enter);
  setTimeout(function(){ if(!started){ started = true; off(); } }, 10000);
})();

render();
